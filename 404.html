A0-31BF,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF}
*{box-sizing:border-box;margin:0}
body,button,input,textarea{font-synthesis:none}
:root{color-scheme:light}
html,body{min-height:100%;overflow-x:hidden;overflow-x:clip}
.shell,.hero,.stage{max-width:100%}
body{background:radial-gradient(1200px 700px at 15% 0%,var(--page2),transparent 70%),radial-gradient(1000px 800px at 100% 100%,var(--page2),transparent 70%),var(--page);color:var(--ink2);font-family:var(--f-ui);font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-inline:20px;padding-block:24px 40px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}

.shell{position:relative;max-width:1060px;margin:0 auto;background:var(--shell);border-radius:42px;box-shadow:var(--shadow-shell);padding:20px 36px 40px;overflow:hidden}

/* ===== EclipseButton（原生移植） ===== */
.ecl{position:relative;isolation:isolate;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;height:49px;padding:0 28px;border-radius:999px;border:1.5px solid var(--line);background:var(--shell);color:var(--ink);font-size:14.5px;font-weight:600;white-space:nowrap;will-change:transform;-webkit-tap-highlight-color:transparent}
.ecl .ecl-c{display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:letter-spacing .4s cubic-bezier(.16,1,.3,1),transform .4s cubic-bezier(.16,1,.3,1)}
.ecl.is-hover .ecl-c{letter-spacing:.05em;transform:scale(1.02)}
.ecl .ecl-base{position:relative;z-index:1;pointer-events:none}
.ecl .ecl-over{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;pointer-events:none;user-select:none;background:var(--btn);color:var(--on-btn);clip-path:circle(0px at 50% 50%);-webkit-clip-path:circle(0px at 50% 50%)}
.ecl .ecl-over::before{content:"";position:absolute;inset:0;background:var(--noise);opacity:.2;mix-blend-mode:overlay}
.ecl svg{width:18px;height:18px;flex:none}
.ecl.primary{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.ecl.primary .ecl-over{background:var(--shell);color:var(--ink)}
.ecl.sm{height:40px;padding:0 18px;font-size:13.5px}
.ecl.lg{height:58px;padding:0 36px;font-size:16.5px}
.ecl.icon{width:44px;height:44px;padding:0}
.ecl .avatar{display:grid;place-items:center;width:43px;height:43px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(20,20,25,.12)}
.ecl .avatar svg{width:28px;height:28px}
.ecl.wx{height:58px;padding:0 26px 0 7px;font-size:19px;font-weight:700;border-width:2px}
.ecl.wx .ecl-c{gap:12px}
.ecl.wx.xl{height:65px;padding:0 32px 0 9px;font-size:21.5px}
.ecl.wx.xl .avatar{width:49px;height:49px}.ecl.wx.xl .avatar svg{width:32px;height:32px}
.beacon{position:relative;width:11px;height:11px;flex:none;border-radius:50%;background:#16c95c;animation:beacon 1.6s ease-in-out infinite}
.beacon::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #16c95c;opacity:0;animation:ripple 1.6s ease-out infinite}
@keyframes beacon{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
@keyframes ripple{0%{opacity:.7;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}

/* ===== 头部 ===== */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding-bottom:14px}
.tabs{display:flex;gap:10px}
.tab{display:inline-flex;align-items:center;gap:10px;height:49px;padding:0 9px 0 22px;border-radius:999px;border:1.5px solid var(--line);background:var(--shell);font-size:16.3px;font-weight:500;color:var(--ink);transition:background .25s,color .25s,border-color .25s,transform .15s}
.tab:not(.active):hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.tab .count{min-width:28px;height:28px;padding:0 9px;border-radius:999px;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--violet-soft);color:var(--violet);font-variant-numeric:tabular-nums}
.tab .dotmark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.tab .dotmark svg{width:16px;height:16px}
.tab.active{background:var(--btn);border-color:var(--btn);color:var(--on-btn)}
.tab.active .dotmark{background:color-mix(in srgb,var(--on-btn) 16%,transparent)}
.pressing{transform:scale(.96)!important}

.view{display:none}
.view.active{display:block;animation:in .45s cubic-bezier(.16,1,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 主视图 ===== */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:26px}
.hero .badge{margin-top:20px}
h1{position:relative;display:inline-block;font-family:var(--f-title);font-size:clamp(40px,5.2vw,66px);font-weight:600;letter-spacing:-.055em;line-height:1;color:var(--ink)}
h1 .l{display:block;white-space:nowrap}
.dash-head h1{font-size:clamp(34px,5vw,64px)}
h1 .hl{background:var(--title-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;padding-bottom:.06em}
.cloud{position:absolute;left:-50px;top:-25px;width:74px;pointer-events:none;filter:drop-shadow(0 8px 12px rgba(150,120,230,.28));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-3deg)}}
.lead{margin-top:16px;font-size:17px;line-height:2.1;color:var(--ink2);max-width:640px}
.num{display:inline-grid;place-items:center;min-width:30px;height:28px;padding:0 10px;margin:0 3px;border-radius:999px;background:var(--violet-soft);color:var(--violet);font-weight:600;font-size:14.5px;vertical-align:1px}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:12px;height:34px;padding:0 15px 0 12px;border-radius:999px;border:1.5px solid var(--line);font-size:13.2px;color:var(--ink2)}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 18%,transparent)}

.stage{position:relative;width:100%;max-width:860px;padding-block:18px 14px;margin-top:4px;display:grid;place-items:center}
.glow{position:absolute;inset:0 60px;border-radius:50%;background:radial-gradient(closest-side at 40% 55%,var(--glow-a),transparent 75%),radial-gradient(closest-side at 64% 50%,var(--glow-b),transparent 70%);filter:blur(20px);animation:breathe 7s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06);opacity:.8}}
.otp{position:relative;z-index:1;cursor:pointer;display:flex;gap:.3em;font-family:var(--f-otp);font-stretch:112%;font-size:clamp(60px,calc((100vw - 60px) / 4.3),134px);font-weight:700;letter-spacing:-.01em;line-height:1;color:var(--ink);white-space:nowrap;font-feature-settings:"tnum";transition:transform .3s cubic-bezier(.16,1,.3,1)}
.otp:hover{transform:scale(1.015)}
.otp.flip{animation:flip .5s cubic-bezier(.16,1,.3,1)}
@keyframes flip{from{opacity:0;transform:translateY(14px);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}
html:not(.otp-font-ready) .otp{opacity:0}

.timer{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.note{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:7px 14px;border-radius:999px;font-size:13px;line-height:1.4;text-align:left}
.note[hidden]{display:none}
.note i{flex:none;width:7px;height:7px;border-radius:50%;background:currentColor}
.note.warn{background:#fff3e2;color:#a85d00}
.note.err{background:#fde9ea;color:#c0353b}
.hero .note.calib{margin-top:20px}
.note .pulse{position:relative;width:8px;height:8px;animation:beacon 1.6s ease-in-out infinite}
.note .pulse::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ripple 1.6s ease-out infinite}
.ring{position:relative;width:38px;height:38px;border-radius:50%;background:var(--shell);box-shadow:var(--shadow)}
.ring svg{position:absolute;inset:4px;width:30px;height:30px;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--soft);stroke-width:2.6}
.ring .fg{fill:none;stroke:var(--violet);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:87.96;transition:stroke-dashoffset 1s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--violet);font-feature-settings:"tnum"}
.alert .ring .fg{stroke:var(--danger)}.alert .ring b{color:var(--danger)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px;margin-top:18px}
.actions .ecl{width:100%}
.actions .lg{grid-column:1/-1}

/* ===== 其他服务：倾斜叠放的卡片 ===== */
.services{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:22px;margin-top:34px;padding:28px 34px;border-radius:34px;background:var(--soft)}
.services h2{display:flex;align-items:center;gap:11px;font-family:var(--f-title);font-size:clamp(25px,2.6vw,32px);font-weight:600;letter-spacing:-.055em;line-height:1;color:var(--ink)}
.services h2 .h-ico{flex:none;display:grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;background:var(--btn);color:var(--on-btn);box-shadow:0 8px 18px -8px rgba(20,20,25,.5)}
.services h2 .h-ico svg{width:.6em;height:.6em}
.services .sub{margin-top:10px;font-family:var(--f-title);font-size:clamp(14.5px,1.3vw,16.3px);font-weight:600;letter-spacing:-.035em;line-height:1.35;color:var(--ink)}
.services .sub .ai{background:var(--title-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.services .sub .num{font-size:13px}
.services .wx{margin-top:22px}
.deck{position:relative;display:flex;justify-content:center;align-items:center;padding-block:16px;padding-inline:14px;min-width:0}
.card{position:relative;flex:0 1 176px;min-width:0;width:176px;margin-left:-30px;border-radius:28px;background:var(--shell);box-shadow:0 2px 4px rgba(20,20,25,.05),0 18px 36px -18px rgba(20,20,25,.3);overflow:hidden;text-align:left;transform:translateY(var(--y)) rotate(var(--r));transition:transform .45s cubic-bezier(.16,1,.3,1),box-shadow .3s;z-index:var(--z)}
.card:first-child{margin-left:0}
.card .art{height:130px;display:grid;place-items:center;background:var(--tone)}
.card .art .lg{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;overflow:hidden;background:var(--shell);box-shadow:0 10px 20px -10px rgba(20,20,25,.35)}
.card .art img{width:100%;height:100%;object-fit:cover}
.card .meta{padding:14px 18px 18px}
.card .name{font-size:18px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.card .kind{margin-top:3px;font-size:12.5px;color:var(--muted)}
.card:hover{transform:translateY(calc(var(--y) - 14px)) rotate(0deg) scale(1.04);z-index:9;box-shadow:0 2px 4px rgba(20,20,25,.05),0 28px 50px -20px rgba(20,20,25,.4)}

/* ===== 常用账号 ===== */
.dash-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:44px}
.accounts{display:grid;gap:12px;max-width:900px;margin:32px auto 0}
.acct{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 18px 16px 16px;border-radius:30px;background:var(--soft)}
.acct .ico{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--shell);font-size:21px;font-weight:600;color:var(--ink);box-shadow:var(--shadow)}
.acct .txt{min-width:0;flex:1 1 170px}
.acct h3{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:17px;font-weight:600;color:var(--ink)}
.acct .tag{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;background:var(--shell);color:var(--ink2)}
.acct p{margin-top:3px;font-size:13px;color:var(--muted);word-break:break-all}
.acct .code{cursor:pointer;font-size:34px;font-weight:600;letter-spacing:-.03em;color:var(--ink);white-space:nowrap;font-feature-settings:"tnum"}
.acct .tools{display:flex;align-items:center;gap:8px}
.del{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:40px;height:40px;padding:0 12px;border-radius:999px;background:var(--shell);border:1.5px solid var(--line);color:var(--ink);font-size:12.5px;font-weight:600;transition:all .2s}
.del:hover{border-color:var(--danger);color:var(--danger)}
.del .lbl{display:none}
.del.armed{background:var(--danger);border-color:var(--danger);color:#fff}.del.armed .lbl{display:inline}
.empty{padding:40px 24px;text-align:center;border-radius:30px;background:var(--soft);color:var(--muted);line-height:1.9}
.add{max-width:900px;margin:12px auto 0;padding:28px;border-radius:32px;border:1.5px solid var(--line)}
.add h3{font-size:20px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.add > p{margin-top:5px;color:var(--muted);font-size:14px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.full{grid-column:1/-1}
.input,.textarea{width:100%;padding:15px 20px;border-radius:20px;border:1.5px solid transparent;background:var(--soft);color:var(--ink);font-size:15px;outline:none;transition:border-color .2s,background .2s}
.input:focus,.textarea:focus{border-color:var(--ink);background:var(--shell)}
.input::placeholder,.textarea::placeholder{color:var(--muted)}
.add .ecl{width:100%;margin-top:16px}

/* ===== 弹窗 ===== */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:20px;background:var(--overlay);backdrop-filter:blur(10px)}
.modal.active{display:flex;animation:in .3s cubic-bezier(.16,1,.3,1)}
.sheet{width:100%;max-width:520px;max-height:100%;overflow:auto;background:var(--shell);border-radius:36px;padding:28px;box-shadow:0 30px 80px -24px rgba(20,20,25,.45)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheet-head h2{font-size:26px;font-weight:600;letter-spacing:-.03em;color:var(--ink)}
.sheet-head small{display:block;margin-bottom:4px;font-size:13px;color:var(--muted)}
.sheet label{display:block;margin:22px 0 10px;font-size:14px;font-weight:500;color:var(--ink)}
.textarea{height:96px;resize:none;font-family:var(--f-mono);font-size:14px}
.hint{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7}
.history{margin-top:18px;padding:4px 18px;border-radius:24px;background:var(--soft)}
.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0 6px;font-size:12.5px;color:var(--muted)}
.history-head b{color:var(--ink);font-weight:600}
.h-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:1.5px dashed var(--line)}
.h-time{display:block;font-size:12px;color:var(--muted)}
.h-key{margin-top:3px;font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
.h-key:hover{color:var(--violet)}
.h-empty{padding:12px 0 16px;text-align:center;font-size:13px;color:var(--muted)}
.sheet-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin-top:22px}
.sheet-actions .ecl{width:100%}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));z-index:99;display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:999px;background:var(--btn);color:var(--on-btn);font-size:14.5px;box-shadow:0 18px 40px -14px rgba(20,20,25,.55);opacity:0;transform:translate(-50%,20px);transition:all .35s cubic-bezier(.16,1,.3,1);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.active{opacity:1;transform:translate(-50%,0)}
.toast .ok{width:8px;height:8px;border-radius:50%;background:var(--violet);flex:none}
.toast.err .ok{background:var(--danger)}


/* 电脑版：从顶部掉落、带物理摆动的微信信息牌 */
.hang{position:absolute;top:0;right:max(28px,calc((100vw - 1060px) / 2 + 29px));z-index:30;width:250px;transform:scale(.93);transform-origin:top right}
.hang-swing{transform-origin:125px 9px;transform:translateY(-320px);will-change:transform}
.hang-inline{display:none;width:250px;margin:14px auto 0}
.hang-inline .hang-swing{transform:translateY(-80px);opacity:0;transition:opacity .25s}
.strings{display:block;width:250px;height:52px;overflow:visible}
.strings line{stroke:color-mix(in srgb,var(--ink) 45%,transparent);stroke-width:1.4}
.strings .nail{fill:var(--ink)}
.sign{position:relative;display:flex;align-items:center;gap:14px;width:250px;padding:16px 22px 16px 14px;border-radius:26px;background:var(--shell);border:1.5px solid var(--line);text-align:left;box-shadow:0 2px 4px rgba(20,20,25,.05),0 22px 40px -18px rgba(20,20,25,.4);transition:border-color .25s}
.sign:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.sign .pin{position:absolute;top:9px;width:7px;height:7px;border-radius:50%;background:var(--soft);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.sign .pin.l{left:34px}.sign .pin.r{right:34px}
.sign .avatar{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(20,20,25,.14)}
.sign .avatar svg{width:34px;height:34px}
.sign-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.sign-txt small{font-size:12.5px;color:var(--muted)}
.sign-txt b{display:flex;align-items:center;gap:9px;font-size:23px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}

/* 手机版：右下角悬浮微信（底部微信按钮进入视野时自动隐藏） */
.float-wx{display:none;position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;transition:opacity .3s,transform .4s cubic-bezier(.16,1,.3,1)}
.float-wx .ecl.wx{height:56px;font-size:18px;padding:0 22px 0 6px;box-shadow:0 16px 34px -14px rgba(20,20,25,.45)}
.float-wx .ecl .avatar{width:44px;height:44px}.float-wx .ecl .avatar svg{width:29px;height:29px}
.float-wx.hide{opacity:0;transform:translateY(20px);pointer-events:none}
@media (max-width:960px){
  .hang{display:none}
  .services #bottomWechatBanner{display:none}
  .hang-inline{display:block}
  .float-wx{display:flex}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  header{display:flex;flex-direction:column;gap:14px}
  header > .spacer{display:none}
  .tabs{order:2}
  .services{grid-template-columns:1fr;text-align:center;padding:30px 20px}
  .services h2{justify-content:center}
  .services .wx{margin-inline:auto}
}
@media (max-width:620px){
  body{padding-inline:8px;padding-block:8px 20px}
  .shell{border-radius:30px;padding:18px 12px 24px}
  .otp{font-size:calc((100vw - 40px) / 3.4)}
  h1{font-size:44px}
  .dash-head h1{font-size:32px}
  .float-wx{display:flex}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .ecl.wx.xl{height:64px;font-size:21px}
  .tabs{width:100%}.tab{flex:1;justify-content:center;height:48px;font-size:15px;padding:0 8px 0 16px}
  .tab .dotmark{display:none}
  .hero,.dash-head{padding-top:22px}
  .cloud{width:50px;left:-18px;top:-26px}
  .lead{font-size:15.5px}
  .stage{padding-block:16px 12px}
  .actions{margin-top:16px}
  .services{margin-top:28px;padding:24px 14px;gap:20px}
  .services .sub{font-size:16px}
  .deck{flex-wrap:wrap;gap:14px}
  .card{flex:0 0 calc(50% - 7px);width:calc(50% - 7px);margin-left:0}
  .deck{padding-inline:0}
  .card .art{height:104px}
  .form{grid-template-columns:1fr}
  .add,.sheet{padding:22px}
  .acct .code{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEMO='JBSWY3DPEHPK3PXP';
/* 校准后的当前时间：设备时钟 + 与服务器的偏差 */
let CLOCK_OFFSET=0;
const nowMs=()=>Date.now()+CLOCK_OFFSET;

function cleanSecret(str){
  if(!str)return '';
  if(str.includes('secret=')){const m=str.match(/secret=([A-Za-z2-7]+)/i);if(m)return m[1].toUpperCase()}
  return str.replace(/[\s=-]/g,'').toUpperCase();
}
function getSecretFromUrl(){
  try{
    var h=decodeURIComponent((location.hash||'').slice(1).trim());if(h)return h;
    var p=new URLSearchParams(location.search),q=p.get('key')||p.get('secret')||p.get('s');if(q)return q;
    var path=decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,'').trim());
    if(path&&path!=='index.html'&&!path.includes('.')&&!path.includes('/'))return path;
  }catch(e){}
  return '';
}
function isValidKey(s){try{base32ToBytes(s);return true}catch(e){return false}}
let KEY_INVALID=false;

function maskKey(k){if(!k)return '';const l=k.toLowerCase();return l.length<=8?l:l.slice(0,4)+'••••'+l.slice(-4)}
function maskEmail(e){if(!e)return '';const p=e.split('@');if(p.length<2)return e;const n=p[0];return (n.length<=3?n+'•••':n.slice(0,4)+'•••')+'@'+p[1]}

function base32ToBytes(value) {
      var alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
      var clean = String(value || "").toUpperCase().replace(/[\s=-]/g, "");
      if (!clean) throw new Error("密钥为空");

      var bits = "";
      var bytes = [];

      for (var i = 0; i < clean.length; i += 1) {
        var index = alphabet.indexOf(clean.charAt(i));
        if (index < 0) throw new Error("密钥包含无效字符");
        bits += index.toString(2).padStart(5, "0");
      }

      for (var bit = 0; bit + 8 <= bits.length; bit += 8) {
        bytes.push(parseInt(bits.slice(bit, bit + 8), 2));
      }

      if (!bytes.length) throw new Error("密钥字节不足");
      return bytes;
    }

    function rotateLeft(value, shift) {
      return (value << shift) | (value >>> (32 - shift));
    }

    function sha1(input) {
      var bytes = input.slice();
      var bitLength = bytes.length * 8;
      bytes.push(128);

      while ((bytes.length % 64) !== 56) {
        bytes.push(0);
      }

      var high = Math.floor(bitLength / 4294967296);
      var low = bitLength >>> 0;

      for (var h = 3; h >= 0; h -= 1) bytes.push((high >>> (h * 8)) & 255);
      for (var l = 3; l >= 0; l -= 1) bytes.push((low >>> (l * 8)) & 255);

      var h0 = 0x67452301, h1 = 0xefcdab89, h2 = 0x98badcfe, h3 = 0x10325476, h4 = 0xc3d2e1f0;
      var words = new Array(80);

      for (var offset = 0; offset < bytes.length; offset += 64) {
        for (var w = 0; w < 16; w += 1) {
          var p = offset + w * 4;
          words[w] = ((bytes[p] << 24) | (bytes[p + 1] << 16) | (bytes[p + 2] << 8) | bytes[p + 3]) | 0;
        }
        for (var next = 16; next < 80; next += 1) {
          words[next] = rotateLeft(words[next - 3] ^ words[next - 8] ^ words[next - 14] ^ words[next - 16], 1);
        }

        var a = h0, b = h1, c = h2, d = h3, e = h4;
        for (var round = 0; round < 80; round += 1) {
          var f, k;
          if (round < 20) { f = (b & c) | ((~b) & d); k = 0x5a827999; }
          else if (round < 40) { f = b ^ c ^ d; k = 0x6ed9eba1; }
          else if (round < 60) { f = (b & c) | (b & d) | (c & d); k = 0x8f1bbcdc; }
          else { f = b ^ c ^ d; k = 0xca62c1d6; }

          var temp = (rotateLeft(a, 5) + f + e + k + words[round]) | 0;
          e = d; d = c; c = rotateLeft(b, 30); b = a; a = temp;
        }

        h0 = (h0 + a) | 0; h1 = (h1 + b) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0;
      }

      var output = [];
      [h0, h1, h2, h3, h4].forEach(function(word) {
        output.push((word >>> 24) & 255, (word >>> 16) & 255, (word >>> 8) & 255, word & 255);
      });
      return output;
    }

    function hmacSha1(key, message) {
      var normalized = key.length > 64 ? sha1(key) : key.slice();
      while (normalized.length < 64) normalized.push(0);

      var inner = [], outer = [];
      for (var i = 0; i < 64; i += 1) {
        inner.push(normalized[i] ^ 0x36);
        outer.push(normalized[i] ^ 0x5c);
      }
      return sha1(outer.concat(sha1(inner.concat(message))));
    }

    async function generateTOTP(secret, period = 30) {
      try {
        var counter = Math.floor(nowMs() / 1000 / period);
        var high = Math.floor(counter / 4294967296);
        var low = counter >>> 0;
        var message = [];

        for (var h = 3; h >= 0; h -= 1) message.push((high >>> (h * 8)) & 255);
        for (var l = 3; l >= 0; l -= 1) message.push((low >>> (l * 8)) & 255);

        var digest = hmacSha1(base32ToBytes(secret), message);
        var offset = digest[digest.length - 1] & 15;

        var binary = (
          ((digest[offset] & 127) << 24) |
          ((digest[offset + 1] << 16)) |
          ((digest[offset + 2] << 8)) |
          digest[offset + 3]
        ) >>> 0;

        var otp = String(binary % 1000000).padStart(6, "0");
        return otp.slice(0, 3) + " " + otp.slice(3);
      } catch (e) {
        return "------";
      }
    }

function copyText(text){
  if(!text)return Promise.reject();
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(text).catch(()=>fallbackCopy(text)?undefined:Promise.reject());
  return fallbackCopy(text)?Promise.resolve():Promise.reject();
}

/* ===== EclipseButton：磁吸位移 + 跟随光斑反色 + 字距展开 + 按下缩放 ===== */
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function upgradeEcl(scope){
  (scope||document).querySelectorAll('.ecl:not([data-ready])').forEach(el=>{
    const inner=el.innerHTML;
    el.innerHTML='<span class="ecl-base"><span class="ecl-c">'+inner+'</span></span><span class="ecl-over" aria-hidden="true"><span class="ecl-c">'+inner+'</span></span>';
    el.dataset.ready='1';
    const over=el.querySelector('.ecl-over');
    /* 弹簧参数对应 motion 的 { stiffness: 250, damping: 25 } */
    const K=250,C=25;
    const s={x:0,y:0,vx:0,vy:0,tx:0,ty:0,sc:1,tsc:1,hover:false,raf:0,w:0,h:0};
    function measure(){const r=el.getBoundingClientRect();s.w=r.width;s.h=r.height;return r}
    function step(){
      for(let i=0;i<2;i++){const dt=1/120;
        s.vx+=(-K*(s.x-s.tx)-C*s.vx)*dt;s.vy+=(-K*(s.y-s.ty)-C*s.vy)*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;}
      s.sc+=(s.tsc-s.sc)*0.35;
      const mx=REDUCED?0:(s.x-s.w/2)*0.15,my=REDUCED?0:(s.y-s.h/2)*0.15;
      el.style.transform='translate('+mx.toFixed(2)+'px,'+my.toFixed(2)+'px) scale('+s.sc.toFixed(3)+')';
      const cp=s.hover?'circle(100px at '+s.x.toFixed(1)+'px '+s.y.toFixed(1)+'px)':'circle(0px at 50% 50%)';
      over.style.clipPath=cp;over.style.webkitClipPath=cp;
      const moving=Math.abs(s.vx)+Math.abs(s.vy)>.05||Math.abs(s.x-s.tx)+Math.abs(s.y-s.ty)>.2||Math.abs(s.sc-s.tsc)>.002;
      s.raf=moving||s.hover?requestAnimationFrame(step):0;
      if(!s.raf&&!s.hover)el.style.transform='';
    }
    const kick=()=>{if(!s.raf)s.raf=requestAnimationFrame(step)};
    function point(e){const r=measure();s.tx=e.clientX-r.left;s.ty=e.clientY-r.top}
    el.addEventListener('pointerenter',e=>{if(e.pointerType!=='mouse')return;const r=measure();s.x=s.tx=e.clientX-r.left;s.y=s.ty=e.clientY-r.top;s.vx=s.vy=0;s.hover=true;el.classList.add('is-hover');kick()});
    el.addEventListener('pointermove',e=>{if(!s.hover)return;point(e);kick()});
    el.addEventListener('pointerleave',()=>{s.hover=false;el.classList.remove('is-hover');s.tx=s.w/2;s.ty=s.h/2;s.tsc=1;kick()});
    el.addEventListener('pointerdown',e=>{
      if(e.pointerType!=='mouse'){const r=measure();s.x=s.tx=e.clientX-r.left;s.y=s.ty=e.clientY-r.top;s.hover=true;el.classList.add('is-hover')}
      s.tsc=.95;kick()});
    const up=e=>{s.tsc=1;if(e&&e.pointerType&&e.pointerType!=='mouse'){setTimeout(()=>{s.hover=false;el.classList.remove('is-hover');s.tx=s.w/2;s.ty=s.h/2;kick()},260)}kick()};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}

/* ===== 信息牌物理：弹簧掉落 + 阻尼单摆 ===== */
function hangSign(sw,sign,dropFrom){
  if(!sw||!sign)return ()=>{};
  if(REDUCED){sw.style.transform='none';sw.style.opacity='1';return ()=>{}}
  const W0=5.2,DAMP=1.25;        // 单摆固有角频率与阻尼
  const K=170,C=13;              // 掉落弹簧
  let y=dropFrom,vy=0,th=0,om=0,landed=false,raf=0,started=false;
  function step(){
    for(let i=0;i<2;i++){const dt=1/120;
      const ay=-K*y-C*vy; vy+=ay*dt; y+=vy*dt;
      if(!landed&&y>-2){landed=true;om+=1.35}
      const a=-W0*W0*Math.sin(th)-DAMP*om; om+=a*dt; th+=om*dt;}
    sw.style.transform='translateY('+y.toFixed(2)+'px) rotate('+(th*57.2958).toFixed(3)+'deg)';
    const busy=Math.abs(y)>.3||Math.abs(vy)>.3||Math.abs(th)>.0015||Math.abs(om)>.005;
    raf=busy?requestAnimationFrame(step):0;
    if(!busy)sw.style.transform='translateY(0) rotate(0deg)';
  }
  const kick=v=>{if(!started)return;om+=v;if(!raf)raf=requestAnimationFrame(step)};
  let lastX=null;
  sign.addEventListener('pointerenter',e=>{lastX=e.clientX});
  sign.addEventListener('pointermove',e=>{if(lastX==null){lastX=e.clientX;return}const dx=e.clientX-lastX;lastX=e.clientX;if(Math.abs(dx)>1)kick(Math.max(-.25,Math.min(.25,dx*.012)))});
  sign.addEventListener('pointerleave',()=>{lastX=null});
  sign.addEventListener('click',()=>kick(.7));
  /* 每隔一段时间轻轻晃一下，持续提醒 */
  setInterval(()=>{if(!document.hidden&&Math.abs(th)<.01&&sign.offsetParent)kick(.55)},14000);
  return function start(){if(started)return;started=true;sw.style.opacity='1';if(!raf)raf=requestAnimationFrame(step)};
}

})();

/* ===== 网络时间校准：优先 Cloudflare /cdn-cgi/trace（毫秒精度），否则读响应头 Date ===== */
async function syncClock(){
  const timed=async(url,opt)=>{const c=new AbortController(),tm=setTimeout(()=>c.abort(),4000);
    try{const t0=Date.now(),r=await fetch(url,Object.assign({cache:'no-store',signal:c.signal},opt)),t1=Date.now();return {r,t0,t1}}finally{clearTimeout(tm)}};
  let off=null;
  try{const {r,t0,t1}=await timed('/cdn-cgi/trace?_='+Date.now());
    if(r.ok){const m=(await r.text()).match(/^ts=([\d.]+)/m);if(m)off=parseFloat(m[1])*1000-(t0+t1)/2}}catch(e){}
  if(off===null){try{const {r,t0,t1}=await timed(location.pathname+'?_t='+Date.now(),{method:'HEAD'});
    const d=Date.parse(r.headers.get('date')||'');if(!isNaN(d))off=d+500-(t0+t1)/2}catch(e){}}
  if(off===null||!isFinite(off))return;
  CLOCK_OFFSET=Math.round(off);
  rawMainCode='';globalTimerTick();
}
syncClock();
setInterval(syncClock,10*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncClock()});
if(KEY_INVALID)$('keyNote').hidden=false;

upgradeEcl();
renderAccountsUI();
globalTimerTick();
